name = "yamhill-racer-relay"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]
