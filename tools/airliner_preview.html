<header><h1>Jumbo jet</h1>Four turbofans · upper deck · swept wings · bogie gear · two-pilot flight deck</header><div id="views"></div>
<script type="module">
import * as THREE from 'three';
import { buildAirlinerModel } from '../game/src/models/airliner.js';
import { createCockpitView } from '../game/src/models/cockpit.js';
import { createVehicleLightLenses } from '../game/src/lights.js';
const params = new URLSearchParams(location.search), cockpitOnly = params.has('cockpit');

  document.querySelector('header').hidden = true;
  document.querySelector('#views').style.cssText = 'display:block;padding:0';
}
for (const [name, position, gear, cockpit] of [
  ['Chase · scaled game camera · gear retracted', [0,12.88,-44.3], 0, false],
  ['Front quarter · landing gear', [34,18,43], 1, false],
  ['Planform · swept low wings', [0,65,1.7], 0, false],

  const section = document.createElement('section'), label = document.createElement('label');
  label.textContent = cockpit ? 'Captain seat · HUD clearance review' : name; section.append(label); document.querySelector('#views').append(section);

  }

  console.log(name, renderer.info.render.triangles, 'triangles', renderer.info.render.calls, 'draws');

</script></html>
