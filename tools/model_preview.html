<!doctype html>
<!-- Offline model sheet: one vehicle type from six angles (+ the far LOD), no game, no network. Served from the repo root
     with node_modules linked: tools/model_preview.html?kind=car&type=sports[&body=%23hex&trim=%23hex&wheels=%23hex][&night] -->
<html><head><meta charset="utf-8"><title>model preview</title>
<style>html,body{margin:0;background:#9fb3c4;overflow:hidden}canvas{display:block}
.l{position:absolute;font:12px system-ui;color:#123;background:#fff8;padding:1px 4px}</style>
<script type="importmap">{ "imports": {
  "three": "../node_modules/three/build/three.module.js",
  "three/addons/": "../node_modules/three/examples/jsm/"
} }</script></head><body>
<script type="module">
import * as THREE from 'three';
import { paintedModel } from '../game/src/cosmetics.js';
const q = new URLSearchParams(location.search), kind = q.get('kind') || 'car', type = q.get('type') || 'sports';
const colors = {}; for (const k of ['body', 'trim', 'wheels']) if (q.get(k)) colors[k] = q.get(k);
const night = q.has('night');
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(W, H); renderer.setScissorTest(true);
renderer.shadowMap.enabled = true; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(night ? 0x203048 : 0xdfeaff, night ? 0x080808 : 0x5a5040, night ? .5 : 1.5));
const sun = new THREE.DirectionalLight(night ? 0x8090b0 : 0xfff2dd, night ? .4 : 2.2); sun.position.set(4, 8, 5); sun.castShadow = true;
sun.shadow.camera.left = sun.shadow.camera.bottom = -4; sun.shadow.camera.right = sun.shadow.camera.top = 4; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: night ? 0x1b1d20 : 0x6e7378 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const model = paintedModel(kind, colors, type); scene.add(model);
model.traverse(o => { if (o.isMesh) o.castShadow = true; });
// stand it on the ground: lowest tyre point
model.updateMatrixWorld(true);
const ud = model.userData, low = Math.min(...(ud.wheels || []).map(w => w.holder.position.y - w.r));
model.position.y = -low;
if (q.has('lights') || night) {
  const { createVehicleLightLenses } = await import('../game/src/lights.js');
  const l = createVehicleLightLenses(model, kind); l.update({ night: 1, on: true, brake: 1 });
}
const views = [
  ['front 3/4', [5.2, 1.9, 5.6], [0, .5, .2]], ['rear 3/4', [-5.0, 2.0, -5.8], [0, .5, -.2]],
  ['side', [8.5, .75, 0], [0, .55, 0], 26], ['top', [0, 10, .01], [0, 0, 0], 32],
  ['front', [0, .9, 8], [0, .55, 0], 24], ['rear', [0, 1.0, -8], [0, .55, 0], 24],
  ['low front 3/4', [3.4, .45, 4.6], [0, .45, 0], 40], ['far LOD (80 m, zoomed)', [56, 22, 56], [0, .5, 0], 4.2],
  ['wheel close-up', [3.0, .5, 2.4], [.9, .1, 1.3], 30],
];
const cols = 3, rows = 3, cw = Math.floor(W / cols), ch = Math.floor(H / rows);
views.forEach(([name], i) => { const d = document.createElement('div'); d.className = 'l'; d.textContent = name; d.style.left = (i % cols) * cw + 4 + 'px'; d.style.top = Math.floor(i / cols) * ch + 4 + 'px'; document.body.appendChild(d); });
renderer.setClearColor(night ? 0x0a0f18 : 0x9fb3c4);
views.forEach(([, pos, at, fov = 36], i) => {
  const cam = new THREE.PerspectiveCamera(fov, cw / ch, .05, 200); cam.position.set(...pos); cam.lookAt(new THREE.Vector3(...at).add(new THREE.Vector3(0, 0, 0)));
  const x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch;
  renderer.setViewport(x, y, cw, ch); renderer.setScissor(x, y, cw - 2, ch - 2);
  renderer.render(scene, cam);
});
let tris = 0; model.traverse(o => { if (o.isMesh && o.visible) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
document.title = `model preview ${kind}/${type}: ${tris} triangles in tree`;
window.done = true;
</script></body></html>
