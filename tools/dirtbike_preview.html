<body><h1>Dirt bike · model review</h1><main></main><script type="module">
import * as T from 'three';import {buildBikeModel} from '../game/src/bike.js';
for(const [label,pos]of [['Front quarter',[2.8,1.5,3.8]],['Side',[4.5,1,.05]],['Rear quarter',[-2.8,1.4,-3.8]]]){

}
