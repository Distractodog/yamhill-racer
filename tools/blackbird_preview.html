<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
<header><h1>SR-71 Blackbird</h1>Chines · twin inlet spikes · tandem canopy · inward-canted fins · analogue cockpit</header><div id="views"></div>
<script type="module">
import * as THREE from 'three';
import { buildBlackbirdModel } from '../game/src/models/blackbird.js';
import { createCockpitView } from '../game/src/models/cockpit.js';
import { createVehicleLightLenses } from '../game/src/lights.js';
for (const [name, position, gear, cockpit] of [
  ['Chase · gear retracted · afterburners', [16,9,-24], 0, false],
  ['Front quarter · landing gear', [19,11,26], 1, false],
  ['Planform · long nose and delta wing', [0,32,1.7], 0, false],
  ['Front seat · round analogue instruments', null, 0, true],
]) {
  const section = document.createElement('section'), label = document.createElement('label');
  label.textContent = name; section.append(label); document.querySelector('#views').append(section);
  const renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setSize(1000,625,false); section.append(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#9dc3da');
  scene.add(new THREE.HemisphereLight('#eaf5ff','#78705f',2.2));
  const sun = new THREE.DirectionalLight('#fff0d8',2.5); sun.position.set(-30,70,50); scene.add(sun);
  const fill = new THREE.DirectionalLight('#b2d6ff',1.2); fill.position.set(20,10,-30);scene.add(fill);
  const model = buildBlackbirdModel(); scene.add(model); model.userData.setGear(gear);
  model.userData.flame.visible = !gear; model.userData.flame.scale.z = 1.7;
  const lenses = createVehicleLightLenses(model,'jet'); lenses.update({on:true,time:0});
  const camera = new THREE.PerspectiveCamera(cockpit ? 70 : 40,1.6,.06,20000);
  if (cockpit) {
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(20000,20000),new THREE.MeshLambertMaterial({color:'#708957'}));
    ground.rotation.x = -Math.PI/2; ground.position.y = -200; scene.add(ground);
    const road = new THREE.Mesh(new THREE.PlaneGeometry(25,18000),new THREE.MeshLambertMaterial({color:'#74777a'}));
    road.rotation.x = -Math.PI/2; road.position.y = -199.95; scene.add(road);
    const state = {renderQuat:new THREE.Quaternion(),renderPos:new THREE.Vector3(0,1200,0),vel:new THREE.Vector3(0,0,3500/3.6),throttle:1};
    createCockpitView(camera)(model,true,state);
    camera.position.set(0,...model.userData.cockpit.eye); camera.lookAt(0,camera.position.y,camera.position.z+1);
  } else { camera.position.set(...position);camera.lookAt(0,0,1.5); }
  renderer.render(scene,camera);
  console.log(name, renderer.info.render.triangles, 'triangles', renderer.info.render.calls, 'draws');
}
</script></html>
