<script type="module">
import * as THREE from 'three';
import { paintedModel } from '../game/src/cosmetics.js';
import { ensureGroundInterior } from '../game/src/models/interiors.js';
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight);
renderer.setScissorTest(true); document.body.append(renderer.domElement);
const poses = [[7, 4, 10], [8, 1.2, 0], [-7, 3, -8], null];
for (let i = 0; i < poses.length; i++) {
  const w = innerWidth / 2, h = innerHeight / 2, x = i % 2 * w, y = i < 2 ? h : 0;
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#82939a');

  ground.position.y = -.80; scene.add(ground);

    camera.position.copy(interior.eye); camera.lookAt(interior.eye.clone().add(new THREE.Vector3(0, 0, 10)));

}
console.log('Tank review: front, tracks, custom paint, commander view rendered');
